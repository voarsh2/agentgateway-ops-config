config:
  adminAddr: 0.0.0.0:15000
frontendPolicies:
  http:
    maxBufferSize: 350388608
gateways:
  default:
    port: 3000
routes:
  - name: codex-passthrough
    gateways:
      - default
    matches:
      - path:
          pathPrefix: /codex
    policies:
      urlRewrite:
        path:
          prefix: /
      backendAuth:
        key:
          value: $CODEX_OAUTH_TOKEN
      backendTLS: {}
      ai:
        routes:
          /v1/chat/completions: completions
          /v1/responses: responses
          '*': passthrough
    backends:
      - ai:
          name: codex-agent
          provider:
            openAI: {}
          hostOverride: chatgpt.com:443
          pathPrefix: /backend-api/codex
llm:
  gateways:
    - default
  policies:
    retry:
      attempts: 2
      backoff: 1s
      codes:
        - 249
        - 402
        - 429
      condition: >-
        response.code >= 500 || response.code == 249 || string(response.body).contains("model
        service not available") || string(response.body).contains("temporarily unavailable") ||
        string(response.body).contains("This model is currently overloaded on OpenAI's servers.
        Please try again shortly.")
  providers:
    - name: aicheap-shared
      provider: openAI
      params:
        apiKey: $AICHEAP_API_KEY
        baseUrl: https://api.aicheap.io/v1
    # Native Responses endpoint; legacy Coding Plan keys may be Chat-only.
    - name: zai-responses-shared
      provider:
        custom:
          providerOverride: openai
          formats:
            - type: responses
      params:
        apiKey: $ZAI_API_KEY
        baseUrl: https://api.z.ai/api/v1
    - name: zai-chat-shared
      provider:
        custom:
          providerOverride: openai
          formats:
            - type: completions
      params:
        apiKey: $ZAI_API_KEY
        baseUrl: https://api.z.ai/api/coding/paas/v4
    - name: openai-sub-shared
      provider: openAI
      params:
        apiKey: $CODEX_OAUTH_TOKEN
        baseUrl: https://chatgpt.com/backend-api/codex
  models:
    - name: zai-glm-5.3-flash
      provider:
        reference: zai-chat-shared
      params:
        model: glm-5.3-flash
      transformation:
        reasoning: |-
          has(llmRequest.reasoning) && has(llmRequest.reasoning.effort)
            ? {"effort": llmRequest.reasoning.effort == "xhigh" ? "max" : llmRequest.reasoning.effort == "medium" ? "low" : llmRequest.reasoning.effort}
            : {"effort": "max"}
    - name: zai-glm-5.3
      provider:
        reference: zai-chat-shared
      params:
        model: glm-5.3
      transformation:
        reasoning: |-
          has(llmRequest.reasoning) && has(llmRequest.reasoning.effort)
            ? {"effort": llmRequest.reasoning.effort == "xhigh" ? "max" : llmRequest.reasoning.effort == "medium" ? "low" : llmRequest.reasoning.effort}
            : {"effort": "max"}
    - name: zai-glm-5.2
      provider:
        reference: zai-chat-shared
      params:
        model: glm-5.2
      transformation:
        reasoning: |-
          has(llmRequest.reasoning) && has(llmRequest.reasoning.effort)
            ? {"effort": llmRequest.reasoning.effort == "xhigh" ? "max" : llmRequest.reasoning.effort == "medium" ? "low" : llmRequest.reasoning.effort}
            : {"effort": "max"}
    - name: zai-responses-glm-5.3
      visibility: internal
      provider:
        reference: zai-responses-shared
      params:
        model: glm-5.3
      transformation:
        reasoning: |-
          has(llmRequest.reasoning) && has(llmRequest.reasoning.effort)
            ? {"effort": llmRequest.reasoning.effort == "xhigh" ? "max" : llmRequest.reasoning.effort == "medium" ? "low" : llmRequest.reasoning.effort}
            : {"effort": "max"}
    - name: zai-chat-glm-5.3-flash
      visibility: internal
      provider:
        reference: zai-chat-shared
      params:
        model: glm-5.3-flash
    - name: clawbay-gpt-5.4
      provider: openAI
      params:
        model: gpt-5.4
        apiKey: $CLAWBAY_API_KEY
        baseUrl: https://api.theclawbay.com/v1
      transformation:
        reasoning: 'has(llmRequest.reasoning) ? llmRequest.reasoning : {"effort":"high"}'
        instructions: >-
          has(llmRequest.reasoning) && has(llmRequest.reasoning.effort) &&
          llmRequest.reasoning.effort == "medium"
            ? [
                {
                  "type": "message",
                  "role": "developer",
                  "content": "Use adequate reasoning for the task. Avoid stopping after a shallow first pass when constraints or debugging details matter."
                }
              ] + llmRequest.instructions
            : has(llmRequest.reasoning) && has(llmRequest.reasoning.effort) && llmRequest.reasoning.effort in ["high", "xhigh"]
              ? [
                  {
                    "type": "message",
                    "role": "developer",
                    "content": "This task may require extended reasoning. Do not curtail reasoning early; continue until the reasoning is complete."
                  }
                ] + llmRequest.instructions
              : llmRequest.instructions
      health:
        unhealthyExpression: >-
          response.code == 249 || response.code == 402 || response.code == 429 || response.code >=
          500 || string(response.body).contains("model service not available") ||
          string(response.body).contains("temporarily unavailable") ||
          string(response.body).contains("This model is currently overloaded on OpenAI's servers.
          Please try again shortly.")
        eviction:
          consecutiveFailures: 1
          duration: 1m
          restoreHealth: 1
