config:
  adminAddr: 0.0.0.0:15000
frontendPolicies:
  http:
    maxBufferSize: 350388608
llm:
  port: 3000
  providers:
    - name: aicheap-shared
      provider: openAI
      params:
        apiKey: $AICHEAP_API_KEY
        baseUrl: https://api.aicheap.io/v1
      defaults:
        transformation:
          input: >-
            type(llmRequest.input) == list
              ? llmRequest.input
                  .map(item,
                    (has(item.type) && has(item.id) && item.type == "function_call" && item.id.startsWith("call_t2_"))
                      ? item.merge({"id": "fc_" + item.id.stripPrefix("call_t2_").replace("_", "").substring(0, 60)})
                      : item
                  )
                  .map(item,
                    (has(item.type) && has(item.id) && item.type == "custom_tool_call" && item.id.startsWith("call_t2_"))
                      ? item.merge({"id": "ctc_" + item.id.stripPrefix("call_t2_").replace("_", "").substring(0, 59)})
                      : item
                  )
                  .map(item,
                    (has(item.type) && has(item.id) && item.type == "web_search_call" && item.id.startsWith("call_t2_"))
                      ? item.merge({"id": "ws_" + item.id.stripPrefix("call_t2_").replace("_", "").substring(0, 60)})
                      : item
                  )
              : llmRequest.input
  models:
    - name: clawbay-gpt-5.4
      provider: openAI
      params:
        model: gpt-5.4
        apiKey: $CLAWBAY_API_KEY
        baseUrl: https://api.theclawbay.com/v1
      transformation:
        reasoning: 'has(llmRequest.reasoning) ? llmRequest.reasoning : {"effort":"high"}'
        instructions: >-
          has(llmRequest.reasoning) && has(llmRequest.reasoning.effort) &&
          llmRequest.reasoning.effort == "medium"
            ? [
                {
                  "type": "message",
                  "role": "developer",
                  "content": "Use adequate reasoning for the task. Avoid stopping after a shallow first pass when constraints or debugging details matter."
                }
              ] + llmRequest.instructions
            : has(llmRequest.reasoning) && has(llmRequest.reasoning.effort) && llmRequest.reasoning.effort in ["high", "xhigh"]
              ? [
                  {
                    "type": "message",
                    "role": "developer",
                    "content": "This task may require extended reasoning. Do not curtail reasoning early; continue until the reasoning is complete."
                  }
                ] + llmRequest.instructions
              : llmRequest.instructions
      health:
        unhealthyExpression: response.code == 402 || response.code == 429 || response.code >= 500
        eviction:
          consecutiveFailures: 4
          duration: 1m
          restoreHealth: 1
